<!-- OrgChart Pro - Dependencies -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- OrgChart Pro - Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- OrgChart Pro - Styles -->
<style id="org_pro_inline_styles">
.org-pro-root,.org-pro-root *{box-sizing:border-box}
.org-pro-root{
  position:relative;
  width:100%;
  height:100%;
  min-height:260px;
  overflow:hidden;
  border-radius:var(--org-root-radius,0px);
  background:var(--org-bg,#f6f8fb);
  background-image:radial-gradient(var(--org-bg-dot,rgba(15,23,42,.055)) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--org-text,#0f172a);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.org-pro-canvas{position:absolute;inset:0;width:100%;height:100%}
.org-pro-svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.org-pro-svg.is-grabbing{cursor:grabbing}
.org-pro-svg.is-dragmode .org-pro-node{cursor:move}
.org-pro-link{fill:none;stroke:var(--org-connector,#cbd5e1)}

/* ============ TOOLBAR ============ */
.org-pro-toolbar{
  position:absolute;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  min-height:52px;
  padding:8px 10px;
  border:1px solid var(--org-panel-border,rgba(15,23,42,.08));
  border-radius:14px;
  background:var(--org-panel,rgba(255,255,255,.85));
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:0 10px 34px var(--org-shadow,rgba(15,23,42,.10)),0 1px 2px rgba(15,23,42,.05);
  z-index:20;
}
.org-pro-spacer{flex:1 1 auto}
.org-pro-group{display:flex;align-items:center;gap:4px}
.org-pro-divider{width:1px;height:26px;background:var(--org-panel-border,rgba(15,23,42,.10));margin:0 4px;flex:0 0 auto}

.org-pro-searchwrap{
  position:relative;
  display:flex;
  align-items:center;
  flex:0 1 280px;
  min-width:170px;
}
.org-pro-searchwrap>svg{
  position:absolute;
  left:11px;
  width:15px;height:15px;
  fill:var(--org-muted,#64748b);
  pointer-events:none;
}
.org-pro-search{
  width:100%;
  height:38px;
  border:1px solid var(--org-panel-border,rgba(15,23,42,.10));
  border-radius:10px;
  background:var(--org-field,rgba(255,255,255,.9));
  color:var(--org-text,#0f172a);
  outline:none;
  padding:0 34px 0 34px;
  font-size:13px;
  font-family:inherit;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.org-pro-search::placeholder{color:var(--org-muted,#64748b)}
.org-pro-search:focus{border-color:var(--org-accent,#4f46e5);box-shadow:0 0 0 3px var(--org-accent-glow,rgba(79,70,229,.15))}
.org-pro-search-clear{
  position:absolute;
  right:6px;
  width:24px;height:24px;
  display:none;
  align-items:center;
  justify-content:center;
  border:0;border-radius:7px;
  background:transparent;
  color:var(--org-muted,#64748b);
  cursor:pointer;
  font-size:15px;line-height:1;
}
.org-pro-search-clear:hover{background:var(--org-hover,rgba(15,23,42,.06))}
.org-pro-searchwrap.has-value .org-pro-search-clear{display:inline-flex}

.org-pro-btn{
  height:38px;
  min-width:38px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:0 10px;
  border:1px solid transparent;
  border-radius:10px;
  background:transparent;
  color:var(--org-text,#0f172a);
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  font-family:inherit;
  line-height:1;
  white-space:nowrap;
  transition:background .13s ease,border-color .13s ease,color .13s ease,transform .13s ease;
}
.org-pro-btn:hover{background:var(--org-hover,rgba(15,23,42,.06))}
.org-pro-btn:active{transform:scale(.96)}
.org-pro-btn.is-active{background:var(--org-accent,#4f46e5);color:var(--org-accent-contrast,#fff)}
.org-pro-btn svg{width:16px;height:16px;display:block;fill:currentColor;flex:0 0 auto}

.org-pro-seg{
  display:flex;
  align-items:center;
  padding:3px;
  gap:2px;
  border:1px solid var(--org-panel-border,rgba(15,23,42,.08));
  border-radius:11px;
  background:var(--org-seg,rgba(15,23,42,.045));
}
.org-pro-seg .org-pro-btn{height:32px;min-width:34px;border-radius:8px;padding:0 9px}
.org-pro-seg .org-pro-btn.is-active{box-shadow:0 2px 8px var(--org-accent-glow,rgba(79,70,229,.35))}

.org-pro-nav{display:none;align-items:center;gap:2px;margin-left:6px}
.org-pro-nav.is-on{display:flex}
.org-pro-nav .org-pro-btn{height:30px;min-width:30px;padding:0 6px;border-radius:8px}
.org-pro-nav-count{
  min-width:44px;
  text-align:center;
  color:var(--org-muted,#64748b);
  font-size:12px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}

/* ============ CARD ============ */
.org-pro-card-fo{overflow:visible}
.org-pro-card{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  border:1px solid var(--org-card-border,rgba(15,23,42,.08));
  border-radius:14px;
  background:var(--org-card,#ffffff);
  box-shadow:0 1px 2px rgba(15,23,42,.05),0 10px 26px var(--org-shadow,rgba(15,23,42,.09));
  color:var(--org-card-text,#0f172a);
  overflow:visible;
  transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease;
}
.org-pro-card::before{
  content:"";
  position:absolute;
  top:0;left:14px;right:14px;
  height:3px;
  border-radius:0 0 4px 4px;
  background:var(--org-accent,#4f46e5);
  opacity:.9;
}
.org-pro-card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(15,23,42,.06),0 16px 38px var(--org-shadow-strong,rgba(15,23,42,.16))}
.org-pro-card.is-selected{border-color:var(--org-accent,#4f46e5);box-shadow:0 0 0 2px var(--org-accent,#4f46e5),0 16px 38px var(--org-shadow-strong,rgba(15,23,42,.16))}
.org-pro-card.is-highlighted{
  border-color:var(--org-accent,#4f46e5);
  box-shadow:0 0 0 3px var(--org-accent-glow,rgba(79,70,229,.30)),0 16px 40px var(--org-shadow-strong,rgba(15,23,42,.18));
  animation:orgProPulse 1.6s ease-in-out 2;
}
@keyframes orgProPulse{
  0%,100%{box-shadow:0 0 0 3px var(--org-accent-glow,rgba(79,70,229,.30)),0 16px 40px var(--org-shadow-strong,rgba(15,23,42,.18))}
  50%{box-shadow:0 0 0 9px transparent,0 16px 40px var(--org-shadow-strong,rgba(15,23,42,.18))}
}
.org-pro-card-head{
  flex:1 1 auto;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  min-height:0;
}
.org-pro-avatar{
  flex:0 0 auto;
  object-fit:cover;
  border-radius:12px;
  border:2px solid var(--org-avatar-ring,rgba(15,23,42,.07));
  background:var(--org-hover,#eef2f7);
}
.org-pro-card.is-highlighted .org-pro-avatar,.org-pro-card.is-selected .org-pro-avatar{border-color:var(--org-accent,#4f46e5)}
.org-pro-card-main{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:3px;padding-right:20px}
.org-pro-card-name{
  min-width:0;
  font-size:14.5px;
  font-weight:700;
  line-height:1.2;
  letter-spacing:-.01em;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.org-pro-card-role,.org-pro-card-extra{
  min-width:0;
  color:var(--org-card-muted,#64748b);
  font-size:12px;
  font-weight:500;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.org-pro-card-extra{font-size:11px;opacity:.85}
.org-pro-info-btn{
  position:absolute;
  top:9px;
  right:9px;
  width:24px;height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--org-card-muted,#64748b);
  cursor:pointer;
  transition:background .13s ease,color .13s ease,transform .18s ease;
}
.org-pro-info-btn:hover{background:var(--org-hover,rgba(15,23,42,.07));color:var(--org-card-text,#0f172a)}
.org-pro-info-btn svg{width:14px;height:14px;fill:currentColor;transition:transform .18s ease}
.org-pro-card.is-info-open .org-pro-info-btn svg{transform:rotate(180deg)}
.org-pro-card-details{
  flex:0 0 auto;
  margin:0 12px 10px;
  padding-top:9px;
  border-top:1px solid var(--org-card-border,rgba(15,23,42,.08));
  display:flex;
  flex-direction:column;
  gap:7px;
  overflow:hidden;
}
.org-pro-card-field{min-width:0}
.org-pro-card-field-label{
  font-size:9px;
  font-weight:800;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--org-accent,#4f46e5);
  margin-bottom:1px;
}
.org-pro-card-field-value{
  font-size:12px;
  line-height:1.3;
  color:var(--org-card-text,#0f172a);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.org-pro-kids{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translate(-50%,50%);
  display:inline-flex;
  align-items:center;
  gap:5px;
  height:24px;
  padding:0 9px;
  border:0;
  border-radius:999px;
  background:var(--org-accent,#4f46e5);
  color:var(--org-accent-contrast,#fff);
  cursor:pointer;
  font-size:11px;
  font-weight:700;
  font-family:inherit;
  line-height:1;
  box-shadow:0 4px 12px var(--org-accent-glow,rgba(79,70,229,.4));
  transition:transform .13s ease,filter .13s ease;
  z-index:2;
}
.org-pro-kids:hover{transform:translate(-50%,50%) scale(1.08)}
.org-pro-kids svg{width:11px;height:11px;fill:currentColor;transition:transform .18s ease}
.org-pro-kids.is-collapsed svg{transform:rotate(-90deg)}
.org-pro-root.org-h .org-pro-kids{
  left:auto;
  right:0;
  bottom:auto;
  top:50%;
  transform:translate(50%,-50%);
}
.org-pro-root.org-h .org-pro-kids:hover{transform:translate(50%,-50%) scale(1.08)}
.org-pro-root.org-h .org-pro-kids svg{transform:rotate(-90deg)}
.org-pro-root.org-h .org-pro-kids.is-collapsed svg{transform:rotate(0deg)}

/* ============ DRAWER ============ */
.org-pro-drawer{
  position:absolute;
  top:0;
  right:0;
  width:min(440px,100%);
  height:100%;
  padding:20px;
  border-left:1px solid var(--org-panel-border,rgba(15,23,42,.08));
  background:var(--org-drawer,#ffffff);
  color:var(--org-text,#0f172a);
  box-shadow:-20px 0 48px var(--org-shadow-strong,rgba(15,23,42,.16));
  overflow:auto;
  z-index:30;
  animation:orgProSlideIn .22s cubic-bezier(.2,.8,.25,1);
}
@keyframes orgProSlideIn{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
.org-pro-drawer-close{
  position:absolute;
  top:12px;
  right:12px;
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  border:0;
  border-radius:9px;
  background:var(--org-hover,rgba(15,23,42,.05));
  color:var(--org-text,#0f172a);
  cursor:pointer;
  font-size:16px;
  line-height:1;
  transition:background .13s ease;
}
.org-pro-drawer-close:hover{background:var(--org-hover-strong,rgba(15,23,42,.10))}
.org-pro-profile{text-align:center;padding:26px 12px 18px}
.org-pro-profile img{
  width:96px;height:96px;
  object-fit:cover;
  border-radius:18px;
  border:3px solid var(--org-accent,#4f46e5);
  box-shadow:0 10px 28px var(--org-accent-glow,rgba(79,70,229,.25));
}
.org-pro-profile h2{margin:14px 0 4px;font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.2;color:var(--org-text,#0f172a)}
.org-pro-profile p{
  display:inline-block;
  margin:2px 0 0;
  padding:4px 12px;
  border-radius:999px;
  background:var(--org-accent-soft,rgba(79,70,229,.10));
  color:var(--org-accent,#4f46e5);
  font-size:12.5px;
  font-weight:600;
}
.org-pro-field-list{border-top:1px solid var(--org-panel-border,rgba(15,23,42,.08));padding-top:6px}
.org-pro-field{padding:12px 2px;border-bottom:1px solid var(--org-field-sep,rgba(15,23,42,.05))}
.org-pro-field:last-child{border-bottom:0}
.org-pro-field-label{
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.08em;
  color:var(--org-muted,#64748b);
  margin-bottom:4px;
  text-transform:uppercase;
}
.org-pro-field-value{font-size:14px;line-height:1.4;color:var(--org-text,#0f172a);word-break:break-word}

/* ============ MISC ============ */
.org-pro-toast{
  position:absolute;
  right:16px;
  bottom:16px;
  max-width:min(420px,calc(100% - 32px));
  padding:11px 15px;
  border-radius:11px;
  background:var(--org-toast,rgba(15,23,42,.92));
  color:#fff;
  font-size:13px;
  font-weight:500;
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;
  box-shadow:0 12px 32px rgba(15,23,42,.28);
  z-index:40;
}
.org-pro-toast.is-visible{opacity:1;transform:translateY(0)}
.org-pro-empty,.org-pro-error{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:24px;
  color:var(--org-muted,#64748b);
  text-align:center;
  font-size:14px;
  font-weight:500;
}
.org-pro-empty svg,.org-pro-error svg{width:38px;height:38px;fill:currentColor;opacity:.4}
.org-pro-error{color:#dc2626}
.org-pro-hidden{display:none!important}

@media (max-width:760px){
  .org-pro-toolbar{top:10px;left:10px;right:10px;padding:7px 8px}
  .org-pro-searchwrap{flex-basis:100%}
  .org-pro-btn-label{display:none}
  .org-pro-drawer{top:auto;bottom:0;height:min(76%,560px);width:100%;border-left:0;border-top:1px solid var(--org-panel-border,rgba(15,23,42,.08));border-radius:18px 18px 0 0;animation:none}
}
</style>
